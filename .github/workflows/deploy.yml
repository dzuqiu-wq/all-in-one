# Continuous Deployment â€?on a successful CI run against main, SSH into
# the VPS, pull the freshly merged code, rebuild the production Docker
# images, and roll the stack with zero-downtime semantics.
#
# Required GitHub Secrets (Settings â†?Secrets and variables â†?Actions):
#
#   VPS_HOST           â€?public IP or hostname of the production VPS
#   VPS_USER           â€?SSH user (recommended: a non-root user in the docker group)
#   VPS_SSH_KEY        â€?full private key text (OpenSSH format, no passphrase)
#   VPS_PORT           â€?SSH port (optional, defaults to 22)
#   VPS_PROJECT_PATH   â€?absolute path on the VPS where the repo is cloned
#                        (e.g. /home/deploy/all-in-one-toolbox)
#
# Optional secret:
#   HEALTH_CHECK_URL   â€?full URL the workflow probes after rollout
#                        (defaults to http://${VPS_HOST}/health)
#
# See .github/DEPLOYMENT.md for the one-time setup instructions.

name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip image rebuild and reuse existing images"
        type: boolean
        required: false
        default: false

# Only one deploy may run at a time against the production environment;
# back-to-back pushes will queue rather than race for the SSH socket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Reuse CI as a gate â€?the deploy job will not start unless CI succeeds.
  # ==========================================================================
  ci:
    name: Pre-deploy CI
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # Deploy â€?SSH into the VPS, pull, rebuild, roll, health-check.
  # ==========================================================================
  deploy:
    name: Roll production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://333654.xyz

    steps:
      - name: Checkout repo (for reference only)
        uses: actions/checkout@v4

      - name: Validate required secrets are configured
        # Fail loudly and EARLY if anyone forgot to wire up the secrets.
        # Otherwise appleboy/ssh-action would emit a less helpful error.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ]         && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ]         && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ]      && missing+=("VPS_SSH_KEY")
          [ -z "$VPS_PROJECT_PATH" ] && missing+=("VPS_PROJECT_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "See .github/DEPLOYMENT.md for the setup checklist."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: SKIP_BUILD,VPS_PROJECT_PATH,VPS_HOST
          script_stop: true
          # ----------------------------------------------------------------
          # The remote `script:` block is intentionally minimal: three
          # commands, no control flow, no multi-line if/then/fi.
          #
          # appleboy/ssh-action splits the `script:` block on newlines and
          # injects implicit exit-status checks between lines, which
          # historically miskills scripts at innocuous `if [ â€?]; then`
          # boundaries (the so-called "false = true" trap). We dodge the
          # entire class of problems by shipping the real rollout logic as
          # a committed bash file (.github/scripts/deploy-vps.sh) and
          # letting this workflow only do the three SSH-safe primitives:
          # cd, git reset, exec the script.
          # ----------------------------------------------------------------
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git fetch origin main && git reset --hard origin/main
            bash .github/scripts/deploy-vps.sh

      - name: External health probe
        # Hit the public endpoint from the GitHub runner to confirm the
        # rollout is visible from the outside, not just inside the VPS.
        env:
          HEALTH_URL: ${{ secrets.HEALTH_CHECK_URL || format('https://{0}/health', secrets.VPS_HOST) }}
        run: |
          echo "==> Probing $HEALTH_URL"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$HEALTH_URL" >/tmp/health.txt 2>/dev/null; then
              echo "    OK â€?$(cat /tmp/health.txt | head -c 200)"
              exit 0
            fi
            echo "    attempt $i failed, retrying in 3 s"
            sleep 3
          done
          cat /tmp/health.txt 2>/dev/null; echo '::error::Health probe failed after 10 attempts'
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Triggered by:** ${{ github.actor }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Outcome:** ${{ job.status }}"
            echo ""
            echo "Public URL: https://333654.xyz"
          } >> "$GITHUB_STEP_SUMMARY"



