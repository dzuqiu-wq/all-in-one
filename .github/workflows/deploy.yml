# Continuous Deployment — on a successful CI run against main, SSH into
# the VPS, pull the freshly merged code, rebuild the production Docker
# images, and roll the stack with zero-downtime semantics.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   VPS_HOST           — public IP or hostname of the production VPS
#   VPS_USER           — SSH user (recommended: a non-root user in the docker group)
#   VPS_SSH_KEY        — full private key text (OpenSSH format, no passphrase)
#   VPS_PORT           — SSH port (optional, defaults to 22)
#   VPS_PROJECT_PATH   — absolute path on the VPS where the repo is cloned
#                        (e.g. /home/deploy/all-in-one-toolbox)
#
# Optional secret:
#   HEALTH_CHECK_URL   — full URL the workflow probes after rollout
#                        (defaults to http://${VPS_HOST}/health)
#
# See .github/DEPLOYMENT.md for the one-time setup instructions.

name: Deploy to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Skip image rebuild and reuse existing images"
        type: boolean
        required: false
        default: false

# Only one deploy may run at a time against the production environment;
# back-to-back pushes will queue rather than race for the SSH socket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Reuse CI as a gate — the deploy job will not start unless CI succeeds.
  # ==========================================================================
  ci:
    name: Pre-deploy CI
    uses: ./.github/workflows/ci.yml

  # ==========================================================================
  # Deploy — SSH into the VPS, pull, rebuild, roll, health-check.
  # ==========================================================================
  deploy:
    name: Roll production
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://333654.xyz

    steps:
      - name: Checkout repo (for reference only)
        uses: actions/checkout@v4

      - name: Validate required secrets are configured
        # Fail loudly and EARLY if anyone forgot to wire up the secrets.
        # Otherwise appleboy/ssh-action would emit a less helpful error.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ]         && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ]         && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ]      && missing+=("VPS_SSH_KEY")
          [ -z "$VPS_PROJECT_PATH" ] && missing+=("VPS_PROJECT_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "See .github/DEPLOYMENT.md for the setup checklist."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Pass the dispatch input through so manual reruns can skip the build.
          envs: SKIP_BUILD
          script_stop: true
          # The remote command is intentionally a single multi-line script
          # rather than several `script:` lines so any failure (e.g. git
          # conflict, docker error) aborts the whole rollout via `set -e`.
          script: |
            set -euo pipefail

            # ERR trap: emit the failing command + line number + exit code so
            # remote failures cannot exit silently. Without this, `set -e` just
            # aborts the script and the Actions log only shows the bare
            # "Process exited with status 1" tail, which is useless for
            # diagnosing what Docker actually complained about.
            trap 'rc=$?; echo "::error::Remote step failed at line ${LINENO}: command \"${BASH_COMMAND}\" exited with code ${rc}"; exit $rc' ERR

            # Non-interactive SSH sessions do NOT source ~/.bashrc or ~/.profile,
            # so PATH may be limited to /usr/bin:/bin and miss /usr/local/bin —
            # which is exactly where the docker-compose v1 binary lives on most
            # distributions. Export a robust PATH up front so both `docker` and
            # `docker-compose` resolve regardless of where they are installed.
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:$PATH"

            cd "${{ secrets.VPS_PROJECT_PATH }}"

            echo "==> Sync code from origin/main"
            # We use --hard to guarantee a clean state. The repository on the
            # VPS is treated as a deploy target, not a working copy — local
            # edits there are an anti-pattern and would be lost intentionally.
            git fetch --prune origin
            git reset --hard origin/main

            echo "==> Resolve docker compose command"
            # Prefer the modern `docker compose` plugin, then fall back to the
            # legacy `docker-compose` v1 binary. Both are probed with absolute
            # `command -v` checks so a stripped PATH cannot mask them — and
            # if BOTH are missing we exit loudly with an actionable error
            # instead of silently exec-ing nothing.
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            elif [ -x /usr/local/bin/docker-compose ]; then
              DC="/usr/local/bin/docker-compose"
            elif [ -x /usr/bin/docker-compose ]; then
              DC="/usr/bin/docker-compose"
            else
              echo "::error::Neither 'docker compose' plugin nor 'docker-compose' binary is available on the VPS."
              echo "Install one of:"
              echo "  • Docker Engine + Compose plugin: https://docs.docker.com/engine/install/"
              echo "  • Standalone docker-compose: https://github.com/docker/compose/releases"
              echo "Verified PATH at this point: $PATH"
              exit 1
            fi
            # Print BOTH stdout and stderr of the version probe so a missing
            # docker daemon, dangling socket, or permission issue surfaces here
            # instead of being swallowed by the next command.
            echo "    using: $DC"
            $DC version 2>&1 | head -5 || true
            echo "    docker daemon info (truncated):"
            docker info --format '    server version: {{.ServerVersion}} · containers: {{.Containers}} · images: {{.Images}}' 2>&1 || {
              echo "::error::'docker info' failed — daemon unreachable or current user not in 'docker' group."
              echo "Hint: try 'sudo usermod -aG docker $USER' on the VPS, then log out and back in."
              exit 1
            }

            COMPOSE_FILE="docker-compose.prod.yml"

            # Make the working-directory fact explicit in the log so we can
            # tell at a glance whether we are actually inside the deploy path.
            echo "==> Pre-validate context"
            echo "    pwd:          $(pwd)"
            echo "    target path:  ${{ secrets.VPS_PROJECT_PATH }}"
            echo "    compose file: $COMPOSE_FILE"
            ls -la "$COMPOSE_FILE" 2>&1 || true

            # Sanity-check the compose file actually exists at the deploy path
            # and parses cleanly under the resolved DC binary — this fails
            # MUCH faster than a half-broken `build` and tells us exactly what
            # is wrong (typo in YAML, missing referenced .env, etc).
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "::error::$COMPOSE_FILE not found at $(pwd)"
              echo "Directory listing:"
              ls -la
              exit 1
            fi

            echo "==> Validate compose config"
            # IMPORTANT: appleboy/ssh-action sets `set -e` in the surrounding
            # shell, and combined with our ERR trap, even an `|| { … }`-guarded
            # failure can cause the script to die before the fallback prints.
            # We therefore TEMPORARILY disable `errexit` + the ERR trap, run
            # the validation, capture stderr, then restore strict mode. The
            # explicit `if !` is shell-strict-safe with `set -e` because the
            # condition position naturally masks the non-zero exit.
            set +e
            trap - ERR
            CONFIG_STDERR=$(mktemp)
            if ! $DC -f "$COMPOSE_FILE" config --quiet 2>"$CONFIG_STDERR"; then
              rc=$?
              echo "::error::'$DC -f $COMPOSE_FILE config' failed (exit $rc)"
              echo "----- stderr (verbatim) -----"
              cat "$CONFIG_STDERR"
              echo "----- full config dump (head 80 lines, stderr merged) -----"
              $DC -f "$COMPOSE_FILE" config 2>&1 | head -80 || true
              echo "----- end -----"
              rm -f "$CONFIG_STDERR"
              exit $rc
            fi
            rm -f "$CONFIG_STDERR"
            echo "    compose config OK"
            # Restore strict mode + ERR trap for the rest of the rollout.
            set -e
            trap 'rc=$?; echo "::error::Remote step failed at line ${LINENO}: command \"${BASH_COMMAND}\" exited with code ${rc}"; exit $rc' ERR

            if [ "${SKIP_BUILD:-false}" = "true" ]; then
              echo "==> Rolling without rebuild (SKIP_BUILD=true)"
              # Surface every container/network/volume action via xtrace.
              set -x
              $DC -f "$COMPOSE_FILE" up -d --remove-orphans 2>&1
              set +x
            else
              echo "==> Rebuilding production images"
              # The build step is by far the most likely failure point on a
              # fresh VPS: missing base image, disk full, network outage to the
              # registry, broken Dockerfile. Force xtrace + merge stderr so the
              # Actions log captures the actual docker error verbatim.
              set -x
              $DC -f "$COMPOSE_FILE" build --pull 2>&1
              set +x
              echo "==> Rolling stack"
              set -x
              $DC -f "$COMPOSE_FILE" up -d --remove-orphans 2>&1
              set +x
            fi

            echo "==> Wait for nginx healthcheck (up to 90 s)"
            for i in $(seq 1 45); do
              status=$($DC -f "$COMPOSE_FILE" ps --format json 2>/dev/null \
                | grep -o '"Name":"all-in-one-toolbox-nginx"[^}]*' \
                | grep -o '"Health":"[^"]*"' \
                | head -n1 || true)
              if echo "$status" | grep -q '"Health":"healthy"'; then
                echo "    nginx is healthy"
                break
              fi
              if [ "$i" = "45" ]; then
                echo "::warning::nginx did not report healthy within 90 s — investigate"
              fi
              sleep 2
            done

            echo "==> Final service table"
            $DC -f "$COMPOSE_FILE" ps

            echo "==> Prune dangling images (free disk)"
            docker image prune -f >/dev/null

            echo "==> Rollout complete at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: External health probe
        # Hit the public endpoint from the GitHub runner to confirm the
        # rollout is visible from the outside, not just inside the VPS.
        env:
          HEALTH_URL: ${{ secrets.HEALTH_CHECK_URL || format('http://{0}/health', secrets.VPS_HOST) }}
        run: |
          echo "==> Probing $HEALTH_URL"
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$HEALTH_URL" >/tmp/health.txt 2>/dev/null; then
              echo "    OK — $(cat /tmp/health.txt | head -c 200)"
              exit 0
            fi
            echo "    attempt $i failed, retrying in 3 s"
            sleep 3
          done
          echo "::error::Health probe failed after 10 attempts"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Triggered by:** ${{ github.actor }}"
            echo "- **Event:** ${{ github.event_name }}"
            echo "- **Outcome:** ${{ job.status }}"
            echo ""
            echo "Public URL: https://333654.xyz"
          } >> "$GITHUB_STEP_SUMMARY"
