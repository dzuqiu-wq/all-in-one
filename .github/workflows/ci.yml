# Continuous Integration — runs on every push and pull request to verify
# the codebase still builds, type-checks, and (for the backend) parses
# cleanly before a CD pipeline ever touches the VPS.
#
# This workflow MUST pass for the CD workflow to consider a commit
# deployable — `deploy.yml` has a `needs: ci` gate.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

# Cancel duplicate runs on the same ref so a fresh push supersedes the
# in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Frontend — Next.js production build + type checking
  # ==========================================================================
  frontend:
    name: Frontend · Build + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        # We run tsc explicitly because `next build` skips strict checks when
        # `typescript.ignoreBuildErrors` is enabled in next.config.
        run: npx tsc --noEmit

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Report build size
        if: success()
        run: |
          echo "::group::.next size"
          du -sh .next || true
          echo "::endgroup::"

  # ==========================================================================
  # Backend — Python syntax check via py_compile
  # ==========================================================================
  backend:
    name: Backend · Python compile
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python sources
        # Walks every .py under backend/ and bytecode-compiles it. Any
        # SyntaxError fails the job. Cheaper than a full unit-test suite,
        # catches the overwhelming majority of "broken push" mistakes.
        run: python -m compileall -q app

      - name: Quick import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        # Import the FastAPI app module so we catch import-time wiring
        # errors (missing env defaults, broken relative imports, etc).
        run: python -c "import app.main; print('app.main imported ok')"

  # ==========================================================================
  # Docker — validate that compose files still parse
  # ==========================================================================
  docker-validate:
    name: Docker Compose · Validate
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet
