# Continuous Integration — runs on every push and pull request to verify
# the codebase still builds, type-checks, tests, and (for the backend) parses
# cleanly before a CD pipeline ever touches the VPS.
#
# This workflow MUST pass for the CD workflow to consider a commit
# deployable — `deploy.yml` has a `needs: ci` gate.

name: CI

on:
  # On `main`, CI runs ONLY as part of the deploy pipeline (deploy.yml calls
  # this workflow via `uses: ./.github/workflows/ci.yml`). A second standalone
  # run on the same `main` push would be cancelled by deploy.yml's concurrency
  # group and pollute the branch page with a "cancelled" badge — so we
  # deliberately do not register `push` on main.
  push:
    branches-ignore:
      - "main"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

# Cancel duplicate runs on the same ref so a fresh push supersedes the
# in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Frontend — Next.js production build + lint + unit tests + type checking
  # ==========================================================================
  frontend:
    name: Frontend · Build + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Type check (tsc --noEmit)
        # We run tsc explicitly because `next build` skips strict checks when
        # `typescript.ignoreBuildErrors` is enabled in next.config.
        run: npx tsc --noEmit

      - name: Run unit tests (Vitest)
        run: npm run test:run

      - name: Security audit (npm)
        # Continue on error so a transient advisory does not block CI.
        # Use `audit fix` locally to address findings.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Report build size
        if: success()
        run: |
          echo "::group::.next size"
          du -sh .next || true
          echo "::endgroup::"

  # ==========================================================================
  # Backend — Python syntax check + pytest unit tests
  # ==========================================================================
  backend:
    name: Backend · Compile + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git to use Token for HTTPS Authenticated Fetches
        # Prevents "could not read Username for 'https://github.com'" when pip
        # cache restores dependencies or resolves git-based packages.
        run: |
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python sources
        # Walks every .py under backend/ and bytecode-compiles it. Any
        # SyntaxError fails the job. Cheaper than a full unit-test suite,
        # catches the overwhelming majority of "broken push" mistakes.
        run: python -m compileall -q app

      - name: Quick import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        # Import the FastAPI app module so we catch import-time wiring
        # errors (missing env defaults, broken relative imports, etc).
        run: python -c "import app.main; print('app.main imported ok')"

      - name: Run unit tests (pytest)
        # Skip integration tests in CI — they need Gotenberg running.
        run: pytest tests/ -v -m "not integration"

  # ==========================================================================
  # E2E — Playwright tests against a real Next.js build
  # ==========================================================================
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Start app and run Playwright tests
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 60000 || true
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Docker — validate that compose files still parse
  # ==========================================================================
  docker-validate:
    name: Docker Compose · Validate
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config --quiet