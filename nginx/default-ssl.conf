# =============================================================================
# All-in-One Toolbox - Production Nginx HTTPS Configuration
# =============================================================================
# Usage:
#   1. After Certbot issues certificate, this config will be auto-generated
#   2. Or use this template and replace placeholders manually
# =============================================================================

# Worker processes
worker_processes auto;

# Error log
error_log /var/log/nginx/error.log warn;

# PID
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with real client IP
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript;

    # FILE UPLOAD LIMIT - Critical for 5MB files
    client_max_body_size 10M;

    # Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Upstreams
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ========================================================================
    # HTTP SERVER - Redirect to HTTPS
    # ========================================================================
    server {
        listen 80;
        server_name _;

        # Redirect ALL HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # ========================================================================
    # HTTPS SERVER - Main Entry Point
    # ========================================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificate - REPLACE THESE PATHS
        # After Certbot: /etc/letsencrypt/live/yourdomain.com/fullchain.pem
        # After Certbot: /etc/letsencrypt/live/yourdomain.com/privkey.pem
        ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # SSL Configuration - Modern & Secure
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern TLS Protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # HSTS - Uncomment after confirming HTTPS works
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content Security Policy (adjust for your needs)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://pagead2.googlesyndication.com; frame-src 'self' https://googleads.g.doubleclick.net;" always;

        # ====================================================================
        # API Routes
        # ====================================================================
        location /api/ {
            proxy_pass http://backend;
            add_header X-Backend "fastapi" always;
        }

        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # ====================================================================
        # Frontend Routes
        # ====================================================================
        location / {
            proxy_pass http://frontend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Frontend "nextjs" always;
        }

        location /_next/static {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ====================================================================
        # API Documentation
        # ====================================================================
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
        }

        # ====================================================================
        # ads.txt - AdSense Verification
        # ====================================================================
        location = /ads.txt {
            proxy_pass http://frontend/ads.txt;
            add_header Content-Type text/plain;
            expires 1h;
            access_log off;
        }

        # ====================================================================
        # Error Pages
        # ====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}