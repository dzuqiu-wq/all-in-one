# =============================================================================
# All-in-One Toolbox - Production Nginx Configuration
# =============================================================================
# SSL Certificate Ready: Listen on 80 for Certbot/Let's Encrypt verification
# Upstream connections are INSECURE (HTTP) within Docker network - this is intentional
# =============================================================================

# Worker processes - auto detected
worker_processes auto;

# Error log with timestamps
error_log /var/log/nginx/error.log warn;

# PID file
pid /var/run/nginx.pid;

# Events module - connection handling
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP module
http {
    # Basic Settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with real client IP
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # File handling
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    # CLIENT MAX BODY SIZE - Critical for 5MB file uploads
    client_max_body_size 10M;

    # Proxy settings - Critical for correct IP logging in rate limiter
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Proxy timeouts
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Buffer sizes for file uploads
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ========================================================================
    # UPSTREAM DEFINITIONS
    # ========================================================================
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ========================================================================
    # RATE LIMITING ZONES (Application-level via headers to FastAPI)
    # Note: Nginx-level rate limiting can be added here if needed
    # ========================================================================

    # ========================================================================
    # SERVER BLOCK - HTTP (Port 80)
    # SSL/TLS will be added via Certbot after initial deployment
    # ========================================================================
    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # HSTS (uncomment after SSL is configured)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ====================================================================
        # API ROUTES - Proxy to Backend (FastAPI)
        # ====================================================================
        location /api/ {
            # Rate limit zone (optional - can be enabled)
            # limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend;
            proxy_hide_header X-Request-Id;
            add_header X-Backend "fastapi" always;
        }

        # Health check endpoint (internal)
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }

        # Gotenberg health (internal only, not exposed externally)
        location /internal/gotenberg/health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
            access_log off;
        }

        # ====================================================================
        # FRONTEND / STATIC ROUTES - Proxy to Next.js
        # ====================================================================
        location / {
            proxy_pass http://frontend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Frontend "nextjs" always;

            # Next.js specific headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # Static assets caching
        location /_next/static {
            proxy_pass http://frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Static files (public)
        location /public/ {
            proxy_pass http://frontend;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ====================================================================
        # DOCS - API Documentation (FastAPI/Swagger)
        # ====================================================================
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
        }

        # ====================================================================
        # ERROR PAGES
        # ====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}